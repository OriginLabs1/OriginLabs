[package]
name = "origin-core"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "OriginLabs v0.0.1 portable ledger core: canonical JSON, SHA-256, event building and chain verification."
publish = false

[lib]
name = "origin_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "origin-core"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
